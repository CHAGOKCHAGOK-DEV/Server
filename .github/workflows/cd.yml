name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - develop

  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  deploy:
    # develop push에서 CI가 성공했거나 수동 실행한 경우에만 배포한다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${COMMIT_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # 토큰은 원격 명령줄에 남지 않도록 표준 입력으로만 전달한다.
          printf '%s' "$GHCR_TOKEN" \
            | ssh -i ~/.ssh/deploy_key "ubuntu@$EC2_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/deploy_key "ubuntu@$EC2_HOST" "IMAGE='$IMAGE' bash -s" < scripts/deploy.sh

      - name: Log out of GitHub Container Registry on EC2
        if: always()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: ssh -i ~/.ssh/deploy_key "ubuntu@$EC2_HOST" "docker logout ghcr.io" || true
